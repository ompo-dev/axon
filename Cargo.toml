[package]
name = "axon-uic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
autobins = false
description = "AXON Universal Intelligence Calculus — certified adaptive cognition"
license = "MIT"
keywords = ["adaptive-ai", "continual-learning", "episodic-memory", "neuro-symbolic", "program-synthesis"]
categories = ["algorithms", "science"]

[[bin]]
name = "axon-uic"
path = "src/main.rs"

[[bin]]
name = "axon"
path = "src/bin/axon.rs"

[[bin]]
name = "axon-uic-bench"
path = "src/bin/axon_uic_bench.rs"

[[bin]]
name = "axon-uic-delta-sweep"
path = "src/bin/axon_uic_delta_sweep.rs"

[[bin]]
name = "axon-uic-hybrid-sweep"
path = "src/bin/axon_uic_hybrid_sweep.rs"

[[bin]]
name = "axon-uic-deltaforge-sum"
path = "src/bin/axon_uic_deltaforge_sum.rs"

[[bin]]
name = "axon-uic-deltaforge-avg"
path = "src/bin/axon_uic_deltaforge_avg.rs"

[[bin]]
name = "axon-uic-deltaforge-min"
path = "src/bin/axon_uic_deltaforge_min.rs"

[[bin]]
name = "axon-uic-deltaforge-variance"
path = "src/bin/axon_uic_deltaforge_variance.rs"

[[bin]]
name = "axon-uic-learn-bench"
path = "src/bin/axon_uic_learn_bench.rs"

[[bin]]
name = "axon-uic-live-avg"
path = "src/bin/axon_uic_live_avg.rs"

[[bin]]
name = "axon-uic-online-train"
path = "src/bin/axon_uic_online_train.rs"

[[bin]]
name = "axon-uic-stress"
path = "src/bin/axon_uic_stress.rs"

[[bin]]
name = "axon-uic-online-stream"
path = "src/bin/axon_uic_online_stream.rs"

[[bin]]
name = "axon-uic-specialist-lab"
path = "src/bin/axon_uic_specialist_lab.rs"

[[bin]]
name = "axon-uic-episodic-stream"
path = "src/bin/axon_uic_episodic_stream.rs"

[dependencies]
csv = { version = "1.4.0", optional = true }
microlp = { version = "0.6.0", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[features]
default = ["text-workflows"]
text-workflows = ["dep:csv", "dep:microlp"]
curriculum = ["text-workflows", "dep:serde", "dep:serde_json"]

[[bin]]
name = "axon-uic-curriculum-lab"
path = "src/bin/axon_uic_curriculum_lab.rs"
required-features = ["curriculum"]

[[bin]]
name = "axon-uic-development-lab"
path = "src/bin/axon_uic_development_lab.rs"
required-features = ["curriculum"]

[[bin]]
name = "axon-uic-text-lab"
path = "src/bin/axon_uic_text_lab.rs"
