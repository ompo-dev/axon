<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toshi — chamada</title>
<style>
  :root{ --bg:#0a0c10; --pane:#12151c; --tile:#0c0f15; --ink:#e6e9ef; --dim:#8b93a3; --hot:#ff7a3c;
         --line:#232833; --on:#2ea36b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;
        display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #app{ flex:1; display:flex; min-height:0; }
  /* palco de vídeo (Toshi + o que você compartilha) */
  #stage{ flex:1; padding:12px; display:grid; gap:12px; grid-template-columns:repeat(2,1fr);
          grid-auto-rows:1fr; align-content:start; min-width:0; }
  .tile{ position:relative; background:var(--tile); border:1px solid var(--line); border-radius:12px;
         overflow:hidden; min-height:180px; }
  .tile.big{ grid-column:1 / -1; min-height:300px; }
  .tile video, .tile canvas{ width:100%; height:100%; object-fit:cover; display:block; }
  #cv{ image-rendering:pixelated; background:#05070a; }
  #ic{ image-rendering:auto; background:#05070a; }   /* SUAVE — a imaginação dele não é blocky */
  .label{ position:absolute; left:10px; bottom:10px; background:#000a; color:var(--ink);
          padding:3px 9px; border-radius:20px; font-size:12px; }
  .thought{ position:absolute; left:10px; top:10px; right:10px; color:var(--hot); font-size:13px;
            text-shadow:0 1px 4px #000; }
  /* chat */
  #side{ width:360px; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side h1{ font-size:12px; color:var(--dim); margin:0; padding:10px 14px; border-bottom:1px solid var(--line);
            letter-spacing:.5px; }
  #log{ flex:1; overflow:auto; padding:10px 14px; }
  .msg{ margin:7px 0; word-wrap:break-word; }
  .voce b{ color:#9ecbff; } .voce span{ color:#9ecbff; }
  .toshi b{ color:var(--hot); }
  .meta{ color:var(--dim); font-size:12px; }
  .eco{ color:#6fe0a8; } .novo{ color:var(--hot); } .dev{ color:#5b6474; font-style:italic; font-size:12px; }
  form{ display:flex; border-top:1px solid var(--line); }
  #in{ flex:1; background:transparent; border:0; color:var(--ink); padding:12px 14px; font:inherit; outline:none; }
  form button{ background:transparent; border:0; color:var(--hot); font-size:18px; padding:0 14px; cursor:pointer; }
  /* barra de controle estilo call */
  #bar{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line);
        background:var(--pane); }
  .ctl{ background:#1b202a; color:var(--ink); border:1px solid var(--line); border-radius:24px;
        padding:9px 16px; font:inherit; cursor:pointer; }
  .ctl:hover{ border-color:var(--hot); }
  .ctl.active{ background:var(--on); border-color:var(--on); color:#04160c; font-weight:bold; }
  .sensor{ margin-left:auto; color:var(--dim); font-size:12px; }
  .sensor.live{ color:var(--hot); }
  .meter{ position:absolute; inset:auto 12px 44px 12px; height:10px; background:#0a0d12; border-radius:6px; overflow:hidden; }
  #micBar{ height:100%; width:2%; background:linear-gradient(90deg,#2ea36b,#ff7a3c); transition:width .08s; }
</style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div class="tile big" id="toshiTile">
        <canvas id="cv" width="48" height="30"></canvas>
        <div class="thought" id="thought">acordando…</div>
        <div class="label">🧠 NEURÔNIOS — cada célula é um neurônio (calor = disparo)</div>
      </div>
      <div class="tile" id="imgTile">
        <canvas id="ic" width="64" height="48"></canvas>
        <div class="thought" id="imgLabel">…</div>
        <div class="label">🎨 TOSHI — o que ele vê / imagina / lembra</div>
      </div>
      <div class="tile" id="camTile" hidden>
        <video id="camV" autoplay muted playsinline></video><div class="label">📷 sua câmera</div>
      </div>
      <div class="tile" id="scrTile" hidden>
        <video id="scrV" autoplay muted playsinline></video><div class="label">🖥️ sua tela</div>
      </div>
      <div class="tile" id="micTile" hidden>
        <div class="meter"><div id="micBar"></div></div><div class="label">🎤 seu mic</div>
      </div>
    </div>
    <div id="side">
      <h1>CONVERSA</h1>
      <div id="log"></div>
      <form id="f"><input id="in" placeholder="fale com ele… (estímulo cru)" autocomplete="off"><button>➤</button></form>
    </div>
  </div>
  <div id="bar">
    <button class="ctl" id="mic">🎤 mic</button>
    <button class="ctl" id="cam">📷 câmera</button>
    <button class="ctl" id="scr">🖥️ tela</button>
    <button class="ctl" id="snd">🔊 som</button>
    <span class="sensor" id="sensor">● ocioso</span>
  </div>

<script>
const log=document.getElementById('log'), cv=document.getElementById('cv'), ctx=cv.getContext('2d'),
      thought=document.getElementById('thought'), sensor=document.getElementById('sensor');
let audioOn=true, ac=null, sensorT=0;

function add(cls, html){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html;
  log.appendChild(d); while(log.children.length>60) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight; }

// flat = [r,g,b,r,g,b,...] (cérebro 48x30). Sem loop aninhado = rápido.
function pintar(flat){ const img=ctx.createImageData(48,30), d=img.data;
  for(let p=0,q=0;p<flat.length;p+=3,q+=4){ d[q]=flat[p]; d[q+1]=flat[p+1]; d[q+2]=flat[p+2]; d[q+3]=255; }
  ctx.putImageData(img,0,0); }

// espectro = [[freq,amp],...] tocados JUNTOS (aditivo) = reconstrói o TIMBRE que ele ouviu/pensou
function tocar(esp){ if(!audioOn||!esp||!esp.length) return; if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  const t0=ac.currentTime, dur=0.34, master=ac.createGain(); master.gain.value=0.9; master.connect(ac.destination);
  esp.forEach(([f,a])=>{ const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f; o.type='sine'; const A=Math.min(0.09,(a||0.3)*0.09);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(A,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur); }); }

function pulseSensor(canal){ sensor.textContent='● '+(canal==='audio'?'ouvindo':'vendo')+' você';
  sensor.classList.add('live'); clearTimeout(sensorT);
  sensorT=setTimeout(()=>{ sensor.textContent='● ativo'; sensor.classList.remove('live'); },1200); }

const es=new EventSource('/stream');
es.onopen=()=>{ thought.textContent='ligado — pensando…'; };
es.onerror=()=>{ thought.textContent='reconectando…'; };
es.onmessage=(e)=>{ const m=JSON.parse(e.data);
  if(m.pixels) pintar(m.pixels);
  if(m.som) tocar(m.som);
  if(m.tipo==='pensando'){ thought.textContent='pensa: '+m.foco;
    if(m.texto) add('toshi', `<span class="dev">(devaneio) ${m.texto}</span>`); }
  else if(m.tipo==='fala'){ let meta='';
    if(m.eco) meta+=`<span class="meta">mimetizo:</span> <span class="eco">${m.eco}</span> `;
    if(m.novo) meta+=`<span class="novo">(novo: ${m.novo})</span>`;
    add('toshi', `<b>toshi&gt;</b> ${m.texto}${meta?'<br><span class="meta">'+meta+'</span>':''}`); }
  else if(m.tipo==='video_out'){ pintarIC(m.grid);
    document.getElementById('imgLabel').textContent = m.lembrou ? ('💭 lembrei: '+m.lembrou+' (interpretei)') : (m.gerado ? '💭 imaginando' : '👁️ vendo você');
    pulseSensor(m.gerado?'':'imagem'); }
  else if(m.tipo==='audio_out'){ tocar(m.som); if(!m.gerado) pulseSensor('audio'); }
  else if(m.tipo==='lendo'){ add('toshi', m.chars>0
    ? `<span class="dev">📖 li «${m.titulo}» (${m.chars} chars) — aprendi sozinho</span>`
    : `<span class="dev">📖 procurei «${m.titulo}» — não achei</span>`); }
  else if(m.tipo==='recordacao'){ const tags=(m.tem_rosto?'👤':'')+(m.tem_voz?'🔊':'');
    add('toshi', `<b>toshi&gt;</b> 🧠 ${m.motivo} <b>${m.conceito}</b> ${tags}${m.relacionado?' <span class="meta">— '+m.relacionado+'</span>':''}`); }
};
const ic=document.getElementById('ic'), ictx=ic.getContext('2d');
// flat = [r,g,b,...] (visão 64x48). Suave (image-rendering:auto no CSS).
function pintarIC(flat){ const img=ictx.createImageData(64,48), d=img.data;
  for(let p=0,q=0;p<flat.length;p+=3,q+=4){ d[q]=flat[p]; d[q+1]=flat[p+1]; d[q+2]=flat[p+2]; d[q+3]=255; }
  ictx.putImageData(img,0,0); }

function enviar(tipo, dado){ fetch('/stimulus',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({tipo,dado})}).catch(()=>{}); }

document.getElementById('f').onsubmit=(e)=>{ e.preventDefault(); const inp=document.getElementById('in');
  const v=inp.value.trim(); if(!v) return; add('voce', `<b>você&gt;</b> <span>${v}</span>`); enviar('texto', v); inp.value=''; };

document.getElementById('snd').onclick=(e)=>{ audioOn=!audioOn; e.target.classList.toggle('active',audioOn);
  e.target.textContent=audioOn?'🔊 som':'🔇 mudo'; };
document.getElementById('snd').classList.add('active');

// ---- compartilhar câmera / tela / mic (estilo call, com preview) ----
const dev={};
function pararDev(nome){ const d=dev[nome]; if(!d) return; d.stream.getTracks().forEach(t=>t.stop());
  if(d.iv) clearInterval(d.iv); delete dev[nome]; }

async function ligarVideo(nome, getter, tileId, videoId, rot){
  const btn=document.getElementById(nome==='câmera'?'cam':'scr');
  if(dev[nome]){ pararDev(nome); document.getElementById(tileId).hidden=true; btn.classList.remove('active'); return; }
  try{ const stream=await getter(); const v=document.getElementById(videoId); v.srcObject=stream;
    document.getElementById(tileId).hidden=false; btn.classList.add('active');
    const tmp=document.createElement('canvas'); tmp.width=64; tmp.height=48; const tc=tmp.getContext('2d');
    const iv=setInterval(()=>{ if(!v.videoWidth) return;
      tc.drawImage(v,0,0,64,48); const d=tc.getImageData(0,0,64,48).data;
      const cor=[]; for(let i=0;i<d.length;i+=4){ cor.push(d[i],d[i+1],d[i+2]); }   // R,G,B por pixel (ele INTERPRETA)
      enviar('imagem',{fonte:rot,cor}); },1000);
    dev[nome]={stream,iv}; stream.getVideoTracks()[0].onended=()=>ligarVideo(nome,getter,tileId,videoId,rot);
  }catch(err){ thought.textContent='permissão negada: '+rot; } }

document.getElementById('cam').onclick=()=>ligarVideo('câmera',()=>navigator.mediaDevices.getUserMedia({video:true}),'camTile','camV','câmera');
document.getElementById('scr').onclick=()=>ligarVideo('tela',()=>navigator.mediaDevices.getDisplayMedia({video:true}),'scrTile','scrV','tela');

document.getElementById('mic').onclick=async(e)=>{
  if(dev['mic']){ pararDev('mic'); document.getElementById('micTile').hidden=true; e.target.classList.remove('active'); return; }
  try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const a=new (window.AudioContext||window.webkitAudioContext)(); const src=a.createMediaStreamSource(stream);
    const an=a.createAnalyser(); an.fftSize=128; src.connect(an); const buf=new Uint8Array(an.frequencyBinCount);
    document.getElementById('micTile').hidden=false; e.target.classList.add('active');
    const bar=document.getElementById('micBar');
    const iv=setInterval(()=>{ an.getByteFrequencyData(buf); const lvl=buf.reduce((s,x)=>s+x,0)/buf.length;
      bar.style.width=Math.max(2,Math.min(100,lvl))+'%'; enviar('audio',{energia:Array.from(buf).slice(0,32)}); },200);
    dev['mic']={stream,iv,a}; }catch(err){ thought.textContent='permissão negada: mic'; } };
</script>
</body>
</html>
