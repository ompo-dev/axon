name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: axon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo check --features curriculum --tests
      - run: cargo clippy --features curriculum --all-targets -- -D warnings
      - run: cargo test --features curriculum --test cognitive_cycle_contracts --test development_contracts --test structural_session_contracts --test relational_binding_contracts

  ui:
    name: Observatory UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: axon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
